<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>东方幻想乡 · 输入同步联机</title>
<link rel="stylesheet" href="control-settings.css">
<style>
:root{color-scheme:dark;font:16px system-ui,"Microsoft YaHei",sans-serif;background:#11141b;color:#e5e9f2}body{max-width:1100px;margin:24px auto;padding:0 20px}h1{font-size:25px}p{line-height:1.7;color:#b9c4d5}button,input,select{font:inherit;padding:9px 13px;border:1px solid #45516c;border-radius:7px;background:#252e40;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;align-items:center}#status{padding:14px;background:#1c2837;line-height:1.7}fieldset{border:1px solid #354462;border-radius:8px}iframe{width:100%;height:800px;border:0;margin-top:20px}small,pre{color:#9badc8}pre{white-space:pre-wrap}a{color:#9ddaff}[hidden]{display:none!important}
</style>
<h1>东方幻想乡 · 输入同步联机</h1>
<p>每台电脑的浏览器各自运行游戏，联网同步双方操作。打开网页后会自动加载资源，无需手动复制游戏文件。</p>
<div class="row" id="entry"><button id="create">创建房间</button><input id="room" maxlength="6" placeholder="六位房间码" aria-label="房间码"><button id="join">加入房间</button></div>
<div id="status" role="status">请先启动新版 start-lan.bat。此版本使用 9866 端口。</div>
<p><a href="connection-check.html">连接排查：不加载游戏，单独检测手机与电脑的数据通道</a></p>
<p>加载 7/7 表示引擎初始化和磁盘挂载完成；所有玩家连通并握手后才开始运行 DOS 和游戏，等待连接时可能尚无启动画面。</p>
<div id="control-settings" class="row"></div>
<section id="lobby" hidden>
<p id="room-info"></p>
<div class="row"><button id="seat0">选择 P1</button><button id="seat1">选择 P2</button><button id="seat2" hidden>选择 P3</button><span id="seats"></span></div>
<fieldset id="settings"><legend>本局设置（房主修改）</legend><div class="row">
<label>人数 <select id="players"><option value="2" selected>双人（关闭 3P）</option><option value="3">三人（启用 3P）</option></select></label>
<label>P1 <select id="p1"><option value="0">灵梦 A</option><option value="1">灵梦 B</option><option value="2">魔理沙 A</option><option value="3">魔理沙 B</option></select></label>
<label>P2 <select id="p2"><option value="0">灵梦 A</option><option value="1">灵梦 B</option><option value="2" selected>魔理沙 A</option><option value="3">魔理沙 B</option></select></label>
<label id="p3-setting" hidden>P3 <select id="p3"><option value="0">灵梦 A</option><option value="1">灵梦 B</option><option value="2">魔理沙 A</option><option value="3">魔理沙 B</option></select></label>
<label>难度 <select id="difficulty"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Hard</option><option value="3">Lunatic</option><option value="4">Extra</option></select></label>
<label>生命 <select id="lives"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
<label>炸弹 <select id="bombs"><option>0</option><option>1</option><option selected>2</option></select></label>
</div></fieldset>
<p>Boss 每阶段耐久：双人 ×1.5，三人 ×2.2。倍率按开局人数固定。启用 3P 后需三人全员准备。</p>
<div class="row"><button id="ready">准备</button><button id="start">房主开始游戏</button><button id="leave">结束并返回</button></div>
</section>
<section id="startup-progress" hidden aria-label="各玩家加载进度"></section>
<pre id="diagnostics">局域网帧同步初版 · 等待人工双机验收</pre>
<div id="game"></div>
<script type="module" src="lan.js"></script></html>
