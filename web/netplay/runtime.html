<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>:root{color-scheme:dark;font:14px system-ui;background:#11141b;color:#d7e4f5}body{margin:0}canvas{display:block;width:100%;aspect-ratio:8/5;image-rendering:pixelated;background:#000;outline:none}button{padding:9px;background:#253b50;color:inherit;border:1px solid #55708b;border-radius:6px;cursor:pointer}p{line-height:1.5}pre{white-space:pre-wrap}</style>
<div class="screen"><canvas id="canvas" width="640" height="400" tabindex="0" aria-label="本机运行的 TH04 游戏"></canvas>
</div>
<p><button id="sound">启用本机声音</button> 键盘：方向键移动，Z 射击，X 炸弹，Shift 低速，Esc 暂停。</p>
<p>标准手柄：左摇杆 / 十字键移动，A / × 射击，B / ○ 炸弹，RB / R1 低速，Start / Options 暂停。键盘与手柄均控制你的座位；连接手柄后先按一下按钮。</p>
<p>游戏内暂停：房主用上下选择、Z / Enter / A 确认；客机只能继续。任何人按 Esc / Start 可继续；房主选择退出会关闭全员游戏。</p>
<p>游戏内 BGM：关闭（0） · SE：开启（FM 音效）。浏览器音乐在游戏运行后加载。</p>
<p><label>浏览器音乐音量 <input id="bgm-volume" type="range" min="0" max="100" value="70"></label></p>
<pre id="details">等待房间统一开局…</pre>
<script type="module" src="runtime.js"></script></html>
